name: Build StopAndGo IINA

on:
  push:
    branches: [codex/stopandgo-integration]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version
      - name: Download playback dependencies
        run: ./other/download_libs.sh --skip-plugins
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build fork
        run: >-
          xcodebuild -project iina.xcodeproj -scheme iina
          -configuration Release -derivedDataPath build
          ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO
      - name: Ad-hoc sign and package
        run: |
          codesign --force --deep --sign - build/Build/Products/Release/IINA.app
          codesign --verify --deep --strict build/Build/Products/Release/IINA.app
          ditto -c -k --sequesterRsrc --keepParent build/Build/Products/Release/IINA.app IINA-StopAndGo.zip
      - uses: actions/upload-artifact@v4
        with:
          name: IINA-StopAndGo
          path: IINA-StopAndGo.zip
          retention-days: 14
